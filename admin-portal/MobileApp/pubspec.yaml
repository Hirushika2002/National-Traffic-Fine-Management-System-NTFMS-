name: ntfms_mobile
description: National Traffic Fine Management System - Mobile Application for Drivers
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase & Firestore (shared database with Admin & Driver Web Portals)
  firebase_core: ^3.14.0
  cloud_firestore: ^5.6.9
  firebase_auth: ^5.5.4

  # HTTP & API (kept for future REST API fallback)
  http: ^1.1.0
  dio: ^5.3.0
  
  # State Management
  provider: ^6.0.0
  
  # UI & UX
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  
  # Validation
  email_validator: ^2.1.17


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
